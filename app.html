<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Narro — your walk</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=10" />
<link rel="stylesheet" href="app.css?v=3" />
</head>
<body class="app-body">

  <header class="app-bar">
    <a class="logo" href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a7 7 0 0 0-7 7v4a4 4 0 0 0 4 4h1v-7H7v-1a5 5 0 0 1 10 0v1h-3v7h2a1 1 0 0 1 0 2h-3v2h3a3 3 0 0 0 3-3v-9a7 7 0 0 0-7-7Z"/></svg>
      <span>Narro</span>
    </a>
    <div class="app-bar-route" id="barRoute"></div>
    <a class="app-bar-user" id="barUser" href="login.html">Sign in</a>
  </header>

  <div class="app-shell">
    <aside class="app-stops" id="stopsPane">
      <h2 id="stopsHead">Stops</h2>
      <div id="stopsList"></div>
    </aside>

    <main class="app-stage">
      <img id="stageImg" src="" alt="" />
      <div class="stage-chip"><span class="dot"></span> <span id="stageChip">Now narrating</span></div>

      <div class="player" id="player">
        <div class="player-head">
          <span class="live"><i></i> Live</span>
          <span id="clock">00:00</span>
        </div>
        <h1 id="stopTitle"></h1>
        <div class="wavebars" aria-hidden="true" id="wavebars"></div>
        <div class="player-controls">
          <button type="button" id="prevBtn" aria-label="Previous stop">
            <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
          </button>
          <button type="button" class="big" id="playBtn" aria-label="Play">
            <svg viewBox="0 0 24 24" id="playIcon"><path d="M9 5v14l10-7z"/></svg>
          </button>
          <button type="button" id="nextBtn" aria-label="Next stop">
            <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
          </button>
        </div>
        <p class="player-ask">Hold <strong>space</strong> and ask out loud — “who built this?”</p>
      </div>
    </main>
  </div>

  <script src="assets/data.js?v=2"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var found;

      // A "walk" is any sight or activity promoted to the top of an
      // itinerary day — the guide narrates it as a short standalone session.
      var walk = params.get('walk');
      if (walk) {
        var cityRef = params.get('city') || '';
        var cityObj = window.NARRO_FIND_CITY(cityRef) || {
          name: cityRef || 'Your walk',
          image: 'https://picsum.photos/seed/narro-' + encodeURIComponent((cityRef || walk).toLowerCase().replace(/\s+/g, '-')) + '/1200/800'
        };
        found = {
          city: cityObj,
          route: { id: 'walk', name: walk, stops: 6, minutes: 45, blurb: '' }
        };
      } else {
        found = window.NARRO_FIND_ROUTE(params.get('route')) ||
                window.NARRO_FIND_ROUTE('rome-baroque');
      }
      var city = found.city, route = found.route;

      // Story titles for the demo player — rotated across stops.
      var TITLES = [
        'The fountain that ate a whole aqueduct',
        'A doorway nobody notices',
        'The street that changed its name three times',
        'What the fire spared',
        'The balcony and the rumour',
        'Seven steps that used to be a river',
        'The stone with the wrong date',
        'A window bricked up for tax reasons',
        'The corner where the map lies',
        'The bell that rings a minute late',
        'Two houses, one wall, forty years of silence',
        'The last lamplighter\'s shortcut'
      ];

      document.title = 'Narro — ' + route.name;
      document.getElementById('barRoute').innerHTML =
        city.name + ' · <strong>' + route.name + '</strong>';
      document.getElementById('stageImg').src = city.image;
      document.getElementById('stopsHead').textContent =
        route.stops + ' stops · ~' + Math.round(route.minutes / 60 * 10) / 10 + ' hrs';

      // Wave bars with a static resting shape.
      var wavebars = document.getElementById('wavebars');
      var shape = [0.4, 0.7, 0.5, 0.9, 0.6, 1, 0.5, 0.8, 0.45, 0.75, 0.6, 0.95, 0.5, 0.7, 0.4, 0.85, 0.55, 0.9, 0.45, 0.65];
      for (var i = 0; i < shape.length; i++) {
        var bar = document.createElement('span');
        bar.style.setProperty('--s', shape[i]);
        bar.style.setProperty('--i', i);
        wavebars.appendChild(bar);
      }

      var current = 0, playing = false, seconds = 0, timer = null;
      var stopsList = document.getElementById('stopsList');
      var player = document.getElementById('player');
      var playIcon = document.getElementById('playIcon');

      function fmt(s) {
        var m = Math.floor(s / 60), r = s % 60;
        return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
      }

      function renderStops() {
        var html = '';
        for (var i = 0; i < route.stops; i++) {
          var cls = i < current ? 'stop is-done' : i === current ? 'stop is-current' : 'stop';
          html += '<button type="button" class="' + cls + '" data-i="' + i + '">' +
            '<span class="n">' + (i + 1) + '</span>' +
            '<span class="t">' + TITLES[i % TITLES.length] + '</span>' +
            '<span class="d">' + (2 + (i * 7) % 9) + ' min</span>' +
          '</button>';
        }
        stopsList.innerHTML = html;
        document.getElementById('stopTitle').textContent = TITLES[current % TITLES.length];
        document.getElementById('stageChip').textContent =
          'Now narrating · Stop ' + (current + 1) + ' of ' + route.stops;
      }

      function setPlaying(on) {
        playing = on;
        player.classList.toggle('is-playing', on);
        playIcon.innerHTML = on ? '<path d="M9 5v14M15 5v14"/>' : '<path d="M9 5v14l10-7z"/>';
        document.getElementById('playBtn').setAttribute('aria-label', on ? 'Pause' : 'Play');
        clearInterval(timer);
        if (on) {
          timer = setInterval(function () {
            seconds++;
            document.getElementById('clock').textContent = fmt(seconds);
          }, 1000);
        }
      }

      function goTo(i) {
        current = Math.max(0, Math.min(route.stops - 1, i));
        seconds = 0;
        document.getElementById('clock').textContent = fmt(0);
        renderStops();
      }

      document.getElementById('playBtn').addEventListener('click', function () { setPlaying(!playing); });
      document.getElementById('nextBtn').addEventListener('click', function () { goTo(current + 1); });
      document.getElementById('prevBtn').addEventListener('click', function () { goTo(current - 1); });
      stopsList.addEventListener('click', function (e) {
        var btn = e.target.closest('.stop');
        if (btn) goTo(Number(btn.dataset.i));
      });

      renderStops();

      // If the auth server is running and the visitor is signed in, greet them.
      // On a static host this quietly stays "Sign in".
      fetch('/api/me', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (data && data.user) {
            var link = document.getElementById('barUser');
            link.textContent = data.user.name;
            link.href = 'account.html';
          }
        })
        .catch(function () { /* static hosting — no API, no problem */ });
    })();
  </script>

</body>
</html>
