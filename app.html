<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Narro — your walk</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<link rel="stylesheet" href="styles.css?v=10" />
<link rel="stylesheet" href="app.css?v=5" />
</head>
<body class="app-body">

  <header class="app-bar">
    <a class="logo" href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a7 7 0 0 0-7 7v4a4 4 0 0 0 4 4h1v-7H7v-1a5 5 0 0 1 10 0v1h-3v7h2a1 1 0 0 1 0 2h-3v2h3a3 3 0 0 0 3-3v-9a7 7 0 0 0-7-7Z"/></svg>
      <span>Narro</span>
    </a>
    <div class="app-bar-route" id="barRoute"></div>
    <a class="app-bar-user" id="barBack" href="plan.html">Back to plan</a>
  </header>

  <!-- The walk before it starts. No map yet: nothing to navigate until the
       narration is running, and a map of a city you are only reading about
       is noise. -->
  <main class="brief" id="brief">
    <p class="brief-city" id="briefCity"></p>
    <h1 class="brief-title" id="briefTitle">Your walk</h1>
    <p class="brief-note" id="briefNote"></p>

    <div class="brief-meta" id="briefMeta"></div>

    <ol class="brief-stops" id="briefStops"></ol>

    <div class="brief-go">
      <button type="button" class="btn btn-primary btn-start" id="startBtn">Start the tour</button>
      <p class="brief-hint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-3a8 8 0 0 1 16 0v3"/><path d="M20 15a2 2 0 0 1-2 2h-1v-4h1a2 2 0 0 1 2 2ZM4 15a2 2 0 0 0 2 2h1v-4H6a2 2 0 0 0-2 2Z"/></svg>
        Headphones on. The guide follows your position and starts each stop as you reach it.
      </p>
      <button type="button" class="brief-sim" id="simBtn">Not there yet? Simulate the walk</button>
    </div>
  </main>

  <!-- Everything below only exists once the walk has started. -->
  <div class="walk" id="walk" hidden>
    <div class="walk-map" id="map"></div>

    <div class="stage-chip" id="stageChip"><span class="dot"></span> <span>Now narrating</span></div>
    <button type="button" class="recentre" id="recentreBtn" hidden aria-label="Centre on me">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.4"/><circle cx="12" cy="12" r="8"/><path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3"/></svg>
    </button>

    <div class="player" id="player">
      <div class="player-head">
        <span class="live"><i></i> <span id="liveLabel">Live</span></span>
        <span id="clock">Stop 1</span>
      </div>
      <h2 id="stopTitle">…</h2>
      <p class="player-script" id="stopScript"></p>
      <div class="wavebars" aria-hidden="true" id="wavebars"></div>
      <div class="player-controls">
        <button type="button" id="prevBtn" aria-label="Previous stop">
          <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <button type="button" class="big" id="playBtn" aria-label="Pause">
          <svg viewBox="0 0 24 24" id="playIcon"><path d="M9 5v14M15 5v14"/></svg>
        </button>
        <button type="button" id="nextBtn" aria-label="Next stop">
          <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </div>
      <p class="player-nav" id="playerNav">
        <span class="nav-dot" id="navDot"></span>
        <span id="navText">Finding you…</span>
      </p>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="assets/data.js?v=2"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);

      /* ============ WHAT THIS WALK IS ============ */
      var walkTitle = params.get('walk') || '';
      var cityName = params.get('city') || '';
      var note = params.get('note') || '';
      var lat = parseFloat(params.get('lat'));
      var lng = parseFloat(params.get('lng'));
      var stopNames = (params.get('stops') || '').split('|').filter(Boolean);

      // Opened directly, with nothing handed over: fall back to a catalogue
      // route so the page still means something, but never to a fixed city.
      if (!walkTitle) {
        var fallback = window.NARRO_FIND_ROUTE(params.get('route') || '');
        if (fallback) {
          walkTitle = fallback.route.name;
          cityName = fallback.city.name;
          note = fallback.route.blurb;
        }
      }

      var centre = (isFinite(lat) && isFinite(lng)) ? { lat: lat, lng: lng } : null;

      // Opened cold from the nav, with no city to walk: there is nothing
      // honest to show, so send them where a walk is chosen rather than
      // inventing one.
      if (!walkTitle && !centre) {
        document.getElementById('brief').innerHTML =
          '<p class="brief-city">Narro</p>' +
          '<h1 class="brief-title">Which city are you in?</h1>' +
          '<p class="brief-note">A walk needs somewhere to happen. Pick a city, or let the ' +
          'planner shape a whole trip — either way you land back here, ready to set off.</p>' +
          '<div class="brief-go">' +
            '<a class="btn btn-primary btn-start" href="cities.html">Browse cities</a>' +
            '<p class="brief-hint" style="margin-top:16px">' +
              '<a href="plan.html" style="color:inherit;text-decoration:underline">' +
              'Or plan a trip and start from an itinerary</a></p>' +
          '</div>';
        return;
      }

      document.title = walkTitle ? 'Narro — ' + walkTitle : 'Narro — your walk';
      document.getElementById('barRoute').innerHTML =
        (cityName ? cityName + ' · ' : '') + '<strong>' + (walkTitle || 'Your walk') + '</strong>';
      document.getElementById('briefCity').textContent = cityName;
      document.getElementById('briefTitle').textContent = walkTitle || 'Your walk';
      document.getElementById('briefNote').textContent = note;
      if (!note) document.getElementById('briefNote').hidden = true;
      if (!cityName) document.getElementById('briefCity').hidden = true;
      if (!params.get('walk')) document.getElementById('barBack').href = 'cities.html';

      /* ============ STOPS ============ */
      /* Each stop is a real place: Wikipedia gives the coordinates to walk to
         and the opening lines the guide reads out. */
      var stops = [];
      var briefStops = document.getElementById('briefStops');
      var briefMeta = document.getElementById('briefMeta');

      function metaLine() {
        var mins = Math.max(20, stops.length * 12);
        briefMeta.innerHTML =
          '<span>' + stops.length + (stops.length === 1 ? ' stop' : ' stops') + '</span>' +
          '<span>~' + mins + ' min on foot</span>' +
          '<span>Narrated live</span>';
      }

      function renderBriefStops() {
        briefStops.innerHTML = stops.map(function (s, i) {
          return '<li><span class="n">' + (i + 1) + '</span>' +
            '<span class="t"><strong>' + s.title + '</strong>' +
            (s.desc ? '<em>' + s.desc + '</em>' : '') + '</span></li>';
        }).join('');
        metaLine();
      }

      function wikiApi(query) {
        return fetch('https://en.wikipedia.org/w/api.php?format=json&origin=*&action=query&' + query)
          .then(function (r) { return r.json(); });
      }

      /* Titles handed over by the planner, resolved to coordinates and text. */
      function loadNamedStops(names) {
        return wikiApi('redirects=1&prop=coordinates%7Cextracts%7Cdescription&exintro=1&explaintext=1&exsentences=3&titles=' +
                       names.map(encodeURIComponent).join('%7C'))
          .then(function (data) {
            var pages = data.query && data.query.pages ? data.query.pages : {};
            var byTitle = {};
            Object.keys(pages).forEach(function (k) {
              var p = pages[k];
              if (!p.coordinates) return;
              byTitle[p.title] = {
                title: p.title,
                desc: p.description || '',
                script: p.extract || '',
                lat: p.coordinates[0].lat,
                lng: p.coordinates[0].lon
              };
            });
            // Keep the planner's order.
            return names.map(function (n) { return byTitle[n]; }).filter(Boolean);
          });
      }

      /* Nothing handed over: find the notable places around the centre. */
      function loadNearbyStops(c) {
        return wikiApi('list=geosearch&gscoord=' + c.lat + '%7C' + c.lng + '&gsradius=3000&gslimit=12')
          .then(function (data) {
            var ids = (data.query.geosearch || []).map(function (g) { return g.pageid; });
            if (!ids.length) return [];
            return wikiApi('pageids=' + ids.join('%7C') +
                           '&prop=coordinates%7Cextracts%7Cdescription%7Cpageviews&exintro=1&explaintext=1&exsentences=3')
              .then(function (d2) {
                var pages = d2.query.pages;
                return Object.keys(pages).map(function (k) {
                  var p = pages[k];
                  var views = 0;
                  if (p.pageviews) for (var day in p.pageviews) views += p.pageviews[day] || 0;
                  return {
                    title: p.title,
                    desc: p.description || '',
                    script: p.extract || '',
                    lat: p.coordinates ? p.coordinates[0].lat : null,
                    lng: p.coordinates ? p.coordinates[0].lon : null,
                    views: views
                  };
                }).filter(function (p) { return p.lat && p.script; })
                  .sort(function (a, b) { return b.views - a.views; })
                  .slice(0, 5);
              });
          });
      }

      briefStops.innerHTML = '<li class="loading">Finding the stops…</li>';

      var ready = stopNames.length
        ? loadNamedStops(stopNames)
        : (centre ? loadNearbyStops(centre) : Promise.resolve([]));

      ready.then(function (found) {
        stops = found;
        if (!stops.length) {
          briefStops.innerHTML = '<li class="loading">No stops found for this walk — the guide will improvise.</li>';
          stops = [{ title: walkTitle || 'Your walk', desc: cityName, script: note, lat: centre ? centre.lat : null, lng: centre ? centre.lng : null }];
          metaLine();
          return;
        }
        if (!centre && stops[0].lat) centre = { lat: stops[0].lat, lng: stops[0].lng };
        renderBriefStops();
      }).catch(function () {
        briefStops.innerHTML = '<li class="loading">Could not reach Wikipedia — the walk will run without stop notes.</li>';
      });

      /* ============ STARTING THE WALK ============ */
      var map = null, markers = [], current = 0, speaking = false;
      var walkEl = document.getElementById('walk');
      var briefEl = document.getElementById('brief');

      // Resting waveform, animated only while the guide is talking.
      var wavebars = document.getElementById('wavebars');
      [0.4, 0.7, 0.5, 0.9, 0.6, 1, 0.5, 0.8, 0.45, 0.75, 0.6, 0.95, 0.5, 0.7, 0.4, 0.85, 0.55, 0.9, 0.45, 0.65]
        .forEach(function (h, i) {
          var bar = document.createElement('span');
          bar.style.setProperty('--s', h);
          bar.style.setProperty('--i', i);
          wavebars.appendChild(bar);
        });

      function buildMap() {
        if (map || !centre || !window.maplibregl) return;
        map = new maplibregl.Map({
          container: 'map',
          // OpenFreeMap serves this style with no key and no sign-up.
          style: 'https://tiles.openfreemap.org/styles/bright',
          center: [centre.lng, centre.lat],
          zoom: 14.4,
          attributionControl: { compact: true }
        });
        map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

        map.on('load', function () {
          var line = stops.filter(function (s) { return s.lat; })
                          .map(function (s) { return [s.lng, s.lat]; });
          if (line.length > 1) {
            map.addSource('route', {
              type: 'geojson',
              data: { type: 'Feature', geometry: { type: 'LineString', coordinates: line } }
            });
            map.addLayer({
              id: 'route',
              type: 'line',
              source: 'route',
              paint: {
                'line-color': '#3f5fbe',
                'line-width': 4,
                'line-opacity': 0.85,
                'line-dasharray': [0.5, 1.6]
              }
            });
          }

          stops.forEach(function (s, i) {
            if (!s.lat) return;
            var el = document.createElement('button');
            el.type = 'button';
            el.className = 'pin';
            el.textContent = i + 1;
            el.setAttribute('aria-label', 'Stop ' + (i + 1) + ': ' + s.title);
            el.addEventListener('click', function () { goTo(i); });
            markers.push(new maplibregl.Marker({ element: el })
              .setLngLat([s.lng, s.lat]).addTo(map));
          });

          if (line.length > 1) {
            var b = line.reduce(function (bounds, c) { return bounds.extend(c); },
              new maplibregl.LngLatBounds(line[0], line[0]));
            map.fitBounds(b, { padding: { top: 70, bottom: 260, left: 50, right: 50 }, duration: 0 });
          }
          markStopOnMap();
        });
      }

      function markStopOnMap() {
        markers.forEach(function (m, i) {
          m.getElement().classList.toggle('is-current', i === current);
          m.getElement().classList.toggle('is-done', i < current);
        });
      }

      /* The guide's voice: the browser's own speech synthesis, so a walk needs
         no account and no download. */
      function speak(text) {
        if (!('speechSynthesis' in window) || !text) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-GB';
        u.rate = 0.98;
        u.onstart = function () { setTalking(true); };
        u.onend = function () { setTalking(false); };
        window.speechSynthesis.speak(u);
      }

      function setTalking(on) {
        speaking = on;
        document.getElementById('player').classList.toggle('is-playing', on);
        document.getElementById('playIcon').innerHTML = on
          ? '<path d="M9 5v14M15 5v14"/>'
          : '<path d="M9 5v14l10-7z"/>';
        document.getElementById('liveLabel').textContent = on ? 'Narrating' : 'Paused';
      }

      function goTo(i, opts) {
        current = Math.max(0, Math.min(stops.length - 1, i));
        var s = stops[current];
        visited[current] = true;
        document.getElementById('stopTitle').textContent = s.title;
        document.getElementById('stopScript').textContent = s.script || s.desc || '';
        document.getElementById('clock').textContent = 'Stop ' + (current + 1) + ' of ' + stops.length;
        document.querySelector('#stageChip span:last-child').textContent =
          'Now narrating · ' + s.title;
        markStopOnMap();
        // Tapping a stop or a control recentres; a position fix should not
        // yank the map away from someone reading it.
        if (map && s.lat && !(opts && opts.keepView) && !following) {
          map.easeTo({ center: [s.lng, s.lat], zoom: 15.6, duration: 900 });
        }
        speak((s.script || s.desc || s.title));
        updateNav();
      }

      /* ============ LIVE NAVIGATION ============ */
      /* The walker's own position, from the browser. No account, no key —
         but it needs https (or localhost) and their permission. */
      var me = null;            // { lat, lng, accuracy }
      var meMarker = null;
      var watchId = null;
      var visited = {};         // a stop narrates itself once, not every fix
      var following = true;     // until the walker pans the map themselves
      var simTimer = null;

      function haversineM(a, b) {
        var R = 6371000, toRad = Math.PI / 180;
        var dLat = (b.lat - a.lat) * toRad;
        var dLng = (b.lng - a.lng) * toRad;
        var la1 = a.lat * toRad, la2 = b.lat * toRad;
        var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
        return 2 * R * Math.asin(Math.sqrt(h));
      }

      function fmtDistance(m) {
        return m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m';
      }

      function setNav(text, state) {
        document.getElementById('navText').textContent = text;
        document.getElementById('playerNav').dataset.state = state || '';
      }

      function drawMe() {
        if (!map || !me) return;
        if (!meMarker) {
          var el = document.createElement('div');
          el.className = 'me';
          el.innerHTML = '<i></i>';
          meMarker = new maplibregl.Marker({ element: el }).setLngLat([me.lng, me.lat]).addTo(map);
          document.getElementById('recentreBtn').hidden = false;
        } else {
          meMarker.setLngLat([me.lng, me.lat]);
        }
        if (following) map.easeTo({ center: [me.lng, me.lat], duration: 700 });
      }

      function updateNav() {
        var s = stops[current];
        if (!me) return;
        if (!s || !s.lat) { setNav('Walking with you', 'ok'); return; }
        var d = haversineM(me, s);
        if (d < 30) setNav('You’re at ' + s.title, 'here');
        else setNav(fmtDistance(d) + ' to ' + s.title, 'ok');
      }

      /* Arriving at a stop starts it. The radius grows with a poor fix, so a
         30-metre-accurate phone does not walk past a stop in silence. */
      function maybeTrigger() {
        if (!me) return;
        var radius = Math.max(35, Math.min(me.accuracy || 0, 120));
        for (var i = 0; i < stops.length; i++) {
          if (visited[i] || !stops[i].lat) continue;
          if (haversineM(me, stops[i]) <= radius) {
            goTo(i, { keepView: true });
            return;
          }
        }
      }

      function onFix(lat, lng, accuracy) {
        me = { lat: lat, lng: lng, accuracy: accuracy || 0 };
        drawMe();
        updateNav();
        maybeTrigger();
      }

      function startLocating() {
        if (!('geolocation' in navigator)) {
          setNav('This browser cannot locate you — simulate the walk instead', 'off');
          return;
        }
        setNav('Finding you…', '');
        watchId = navigator.geolocation.watchPosition(
          function (pos) { onFix(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy); },
          function () {
            setNav('Location is off — tap to simulate the walk', 'off');
            document.getElementById('playerNav').onclick = startSimulation;
          },
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
        );
      }

      /* Demoing indoors: walk the route for them, faster than real life. */
      function startSimulation() {
        if (simTimer) return;
        if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        var path = stops.filter(function (s) { return s.lat; });
        if (path.length < 2) return;

        var leg = 0, t = 0;
        var STEP = 0.06; // ~17 fixes per leg, so stops trigger rather than jump
        document.getElementById('playerNav').onclick = null;
        simTimer = setInterval(function () {
          var a = path[leg], b = path[leg + 1];
          if (!b) { clearInterval(simTimer); simTimer = null; setNav('Walk complete', 'here'); return; }
          onFix(a.lat + (b.lat - a.lat) * t, a.lng + (b.lng - a.lng) * t, 12);
          t += STEP;
          if (t >= 1) { t = 0; leg++; }
        }, 500);
        document.getElementById('playerNav').dataset.sim = '1';
      }

      document.getElementById('recentreBtn').addEventListener('click', function () {
        following = true;
        if (me && map) map.easeTo({ center: [me.lng, me.lat], zoom: 16, duration: 600 });
      });

      function beginWalk(simulate) {
        briefEl.hidden = true;
        walkEl.hidden = false;
        document.body.classList.add('is-walking');
        buildMap();
        goTo(0, { keepView: true });
        // Panning the map means they want to look around, not be dragged back.
        if (map) map.on('dragstart', function () { following = false; });
        if (simulate) startSimulation(); else startLocating();
      }

      document.getElementById('startBtn').addEventListener('click', function () { beginWalk(false); });
      document.getElementById('simBtn').addEventListener('click', function () { beginWalk(true); });

      document.getElementById('playBtn').addEventListener('click', function () {
        if (speaking) { window.speechSynthesis.cancel(); setTalking(false); }
        else { speak(stops[current].script || stops[current].desc || stops[current].title); }
      });
      document.getElementById('nextBtn').addEventListener('click', function () { goTo(current + 1); });
      document.getElementById('prevBtn').addEventListener('click', function () { goTo(current - 1); });

      // Leaving the page mid-sentence should not keep the voice going.
      window.addEventListener('pagehide', function () {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (simTimer) clearInterval(simTimer);
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      });
    })();
  </script>

</body>
</html>
